name: text_to_voice
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  collection: ^1.19.1
  just_audio: ^0.10.6
  flutter_onnxruntime: ^1.8.5
  path_provider: ^2.1.6
  image: ^4.10.1
  camera: ^0.12.0+2
  google_mlkit_text_recognition: ^0.16.0
  file_picker: ^13.1.0
  xml: ^7.0.1
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  http: ^1.2.2
  crypto: ^3.0.6
  ffi: ^2.1.0
  share_plus: ^13.3.0
  archive: any
  riverpod: any
  path: any
  cross_file: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.18.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true

  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Variable.ttf
          weight: 400
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700

  assets:
    - assets/voices/voices_v3_turbo.json
